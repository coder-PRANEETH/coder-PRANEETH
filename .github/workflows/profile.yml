name: profile

on:
  push:
    paths:
      - ".github/workflows/profile.yml"
      - "scripts/contrib_agv.py"
  schedule:
    - cron: "37 18 * * *" # every day at 00:07 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Palette for the 3D graph
        run: |
          cat > 3d-contrib.json <<'JSON'
          {
            "type": "normal",
            "backgroundColor": "#131416",
            "foregroundColor": "#EDE9E2",
            "strongColor": "#FF6B1A",
            "weakColor": "#8C9098",
            "radarColor": "#FF6B1A",
            "growingAnimation": true,
            "contribColors": ["#24262B", "#5C2A0E", "#9A4312", "#D65A16", "#FF7A2E"]
          }
          JSON

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: 3d-contrib.json

      - name: AGV contribution floor
        continue-on-error: true
        run: python3 scripts/contrib_agv.py generated/agv.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib 2>/dev/null || true
          git add generated 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "chore: refresh contribution graphics"
          git push
